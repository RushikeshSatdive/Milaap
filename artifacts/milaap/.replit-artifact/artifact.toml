kind = "web"
previewPath = "/"
title = "Milaap"
description = "A community connection platform that helps neighbours, students, colleagues, and local groups build real relationships through shared interests, skill exchanges, and small in-person activities."
version = "1.0.0"
id = "artifacts/milaap"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21544

[services.development]
run = "pnpm --filter @workspace/milaap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/milaap", "run", "build" ]
serve = "static"
publicDir = "artifacts/milaap/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21544"
BASE_PATH = "/"
